<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ドット絵バトルアリーナ（PvP / BOSS）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1020;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 10px;
    }
    .topbar {
      width: 960px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #131c31;
      border: 1px solid #263554;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    input, select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    button { cursor: pointer; font-weight: 600; transition: background 0.15s; }
    button:hover:not(:disabled) { background: #334155; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-danger { background: #dc2626; border-color: #ef4444; }
    .btn-gacha { background: #7c3aed; border-color: #8b5cf6; }
    .btn-gacha:hover:not(:disabled) { background: #6d28d9; }

    .main-layout {
      width: 960px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    .panel {
      background: #131c31;
      border: 1px solid #263554;
      border-radius: 10px;
      padding: 10px;
    }
    .editor-panel { width: 300px; display: flex; flex-direction: column; gap: 8px; }
    .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
    .swatch {
      height: 24px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.06); }
    .special-inks { display: flex; flex-wrap: wrap; gap: 5px; }
    .ink-chip {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid #475569;
      background: #1e293b;
      cursor: pointer;
    }
    .ink-chip.active { border-color: #facc15; background: #312e81; }

    canvas#gameCanvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      display: block;
    }
    .hud-box {
      width: 960px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #131c31;
      border: 1px solid #263554;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .status-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 12px;
    }
    .ultra-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      font-size: 11px;
    }
    .ultra-item {
      background: #0f172a;
      border: 1px solid #263554;
      border-radius: 5px;
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .ultra-item.equipped { border-color: #38bdf8; background: #172554; }
    .log-text { color: #93c5fd; font-size: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <label>名前 <input id="nameInput" type="text" value="プレイヤー" maxlength="16" style="width:110px;" /></label>
      <label>ルーム <input id="roomInput" type="text" value="room_1" maxlength="24" style="width:95px;" /></label>
      <label>モード
        <select id="modeSelect">
          <option value="boss">BOSS戦</option>
          <option value="pvp">PvP対戦</option>
        </select>
      </label>
      <label id="stageLabel">ステージ
        <select id="stageSelect"></select>
      </label>
      <button id="joinBtn" class="btn-primary">入室</button>
      <button id="startBtn" class="btn-primary" disabled>開始</button>
      <button id="lobbyBtn" disabled>ロビー</button>
    </div>
    <div class="row">
      <span class="status-pill" id="connStatus">未接続</span>
      <span class="status-pill" id="pointsDisp">Pt: 1000</span>
      <span class="status-pill" id="elementDisp">属性: 無 (⚪)</span>
      <button id="inkGachaBtn" class="btn-gacha">インクガチャ (300Pt)</button>
      <button id="ultraGachaBtn" class="btn-gacha">必殺技ガチャ (1000Pt)</button>
    </div>
  </div>

  <div class="hud-box">
    <div class="row">
      <span id="matchStateDisp">状態: 待機中</span>
      <span id="timerDisp">残り: --:--</span>
      <span id="hpDisp">HP: 100/100</span>
      <span id="ultraEquipDisp">装備必殺技: なし (Space)</span>
    </div>
    <div class="row">
      <span class="log-text" id="eventLog">操作: WASD/矢印移動, Z=バリア, X=斬撃, C=玉, Space=必殺技</span>
    </div>
  </div>

  <div class="main-layout">
    <div class="panel editor-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>32×32 ドット絵</strong>
        <div class="row" style="gap:4px;">
          <button id="clearCanvasBtn" style="padding:3px 7px; font-size:11px;">消去</button>
          <button id="syncCharBtn" style="padding:3px 7px; font-size:11px;">反映</button>
        </div>
      </div>
      <canvas id="editorCanvas" width="256" height="256" style="background:#ffffff; border-radius:6px; cursor:crosshair; align-self:center;"></canvas>
      <div class="palette" id="colorPalette"></div>
      <div class="special-inks" id="specialInkBox"></div>
      <div>
        <div style="font-size:12px; margin-bottom:4px;">必殺技ストック（クリックで装備・最大3）</div>
        <div class="ultra-grid" id="ultraStockList"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="720"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/bosses.js"></script>
  <script>
    (function () {
      'use strict';

      const BossSystem = window.BossSystem;
      const {
        GAME_RULES,
        STATIC_OBSTACLES,
        SPECIAL_INKS,
        ELEMENT_COLOR_MAP,
        determineElementFromPixels,
        getElementInfo,
        getStageList,
        getStageByNumber,
        sanitizeUltraSkillId,
        getUltraSkillDef,
        getAllUltraSkills,
        handleClientBossAttack,
        updateBossProjectilesClient,
        drawBossEntity,
        drawBossEffectsAndProjectiles
      } = BossSystem;

      const SERVER_AUTHORITATIVE_PROJECTILES = new Set([
        'snake_dark',
        'shadow_orb',
        'curved_fireball',
        'phantom_homing',
        'curse_bolt',
        'feint_orb'
      ]);

      const CLIENT_KEY_STORAGE = 'draw_battle_client_key_v1';
      let clientKey = localStorage.getItem(CLIENT_KEY_STORAGE);
      if (!clientKey) {
        clientKey = 'ck_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(CLIENT_KEY_STORAGE, clientKey);
      }

      const socket = io();

      // DOM refs
      const nameInput = document.getElementById('nameInput');
      const roomInput = document.getElementById('roomInput');
      const modeSelect = document.getElementById('modeSelect');
      const stageSelect = document.getElementById('stageSelect');
      const stageLabel = document.getElementById('stageLabel');
      const joinBtn = document.getElementById('joinBtn');
      const startBtn = document.getElementById('startBtn');
      const lobbyBtn = document.getElementById('lobbyBtn');
      const connStatus = document.getElementById('connStatus');
      const pointsDisp = document.getElementById('pointsDisp');
      const elementDisp = document.getElementById('elementDisp');
      const inkGachaBtn = document.getElementById('inkGachaBtn');
      const ultraGachaBtn = document.getElementById('ultraGachaBtn');
      const matchStateDisp = document.getElementById('matchStateDisp');
      const timerDisp = document.getElementById('timerDisp');
      const hpDisp = document.getElementById('hpDisp');
      const ultraEquipDisp = document.getElementById('ultraEquipDisp');
      const eventLog = document.getElementById('eventLog');
      const editorCanvas = document.getElementById('editorCanvas');
      const editorCtx = editorCanvas.getContext('2d');
      const colorPalette = document.getElementById('colorPalette');
      const specialInkBox = document.getElementById('specialInkBox');
      const ultraStockList = document.getElementById('ultraStockList');
      const gameCanvas = document.getElementById('gameCanvas');
      const gameCtx = gameCanvas.getContext('2d');

      // 32x32 pixel buffer
      const GRID_SIZE = 32;
      const PIXEL_PX = editorCanvas.width / GRID_SIZE;
      let pixels = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill('#ffffff'));
      let selectedBrush = '#ed1c24';
      let isDrawingPixel = false;

      // Client profile state (authoritative sync from server)
      let profile = {
        points: 1000,
        unlockedStage: 1,
        ownedInks: [],
        equippedInk: '',
        ultraStocks: {},
        equippedUltra: null
      };

      // Client battle state
      let isPullingGacha = false;
      let myPlayerId = null;
      let currentMatchId = 0;
      let roomState = 'lobby';
      let roomMode = 'boss';
      let timeLeftSec = 0;
      let playersMap = Object.create(null);
      let bossState = null;
      let breakableWalls = [];
      let itemsList = [];
      let playerShots = [];
      let playerSlashes = [];
      let bossProjectiles = [];
      let bossEffects = [];
      let ultraEffects = [];
      let floatingTexts = [];
      let vortexUntil = 0;
      let vortexPullStrength = 1.55;
      let shakeFrames = 0;
      let shakeIntensity = 0;
      let localLastActionAt = { shield: 0, slash: 0, shot: 0, ultra: 0 };
      let ultraCooldownUntilLocal = 0;

      const keysDown = { up: false, down: false, left: false, right: false };

      function setLog(msg) {
        eventLog.textContent = msg;
      }

      function addFloatingText(x, y, text, color) {
        floatingTexts.push({
          x,
          y,
          text,
          color: color || '#ffffff',
          life: 45,
          maxLife: 45
        });
      }

      function clearRoundTransientState() {
        playerShots = [];
        playerSlashes = [];
        bossProjectiles = [];
        bossEffects = [];
        ultraEffects = [];
        floatingTexts = [];
        vortexUntil = 0;
        shakeFrames = 0;
        shakeIntensity = 0;
        ultraCooldownUntilLocal = 0;
      }

      function unlockActionLocks() {
        isPullingGacha = false;
        inkGachaBtn.disabled = !socket.connected;
        ultraGachaBtn.disabled = !socket.connected;
        joinBtn.disabled = !socket.connected;
      }

      // Build palette & stage select
      const paletteColors = [
        '#ed1c24', '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc',
        '#a349a4', '#b97a57', '#7f7f7f', '#c3c3c3', '#000000', '#ffffff'
      ];
      for (const hex of paletteColors) {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.className = 'swatch' + (hex === selectedBrush ? ' active' : '');
        sw.style.background = hex;
        sw.title = hex;
        sw.addEventListener('click', () => {
          selectedBrush = hex;
          document.querySelectorAll('.swatch').forEach((el) => el.classList.remove('active'));
          document.querySelectorAll('.ink-chip').forEach((el) => el.classList.remove('active'));
          sw.classList.add('active');
        });
        colorPalette.appendChild(sw);
      }

      function renderSpecialInks() {
        specialInkBox.innerHTML = '';
        for (const inkId of profile.ownedInks || []) {
          const info = SPECIAL_INKS[inkId];
          if (!info) continue;
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'ink-chip' + (selectedBrush === inkId ? ' active' : '');
          chip.textContent = info.name;
          chip.addEventListener('click', () => {
            selectedBrush = inkId;
            document.querySelectorAll('.swatch').forEach((el) => el.classList.remove('active'));
            document.querySelectorAll('.ink-chip').forEach((el) => el.classList.remove('active'));
            chip.classList.add('active');
          });
          specialInkBox.appendChild(chip);
        }
      }

      function renderStageOptions() {
        const stages = getStageList();
        const prevVal = Number(stageSelect.value) || 1;
        stageSelect.innerHTML = '';
        for (const st of stages) {
          const opt = document.createElement('option');
          opt.value = String(st.stageNumber);
          const locked = st.stageNumber > (profile.unlockedStage || 1);
          opt.disabled = locked;
          opt.textContent = `${st.title} (${st.boss.name})${locked ? ' [未解放]' : ''}`;
          stageSelect.appendChild(opt);
        }
        const targetNum = prevVal <= (profile.unlockedStage || 1) ? prevVal : 1;
        stageSelect.value = String(targetNum);
      }

      function renderUltraStocks() {
        ultraStockList.innerHTML = '';
        const skills = getAllUltraSkills();
        for (const sk of skills) {
          const stock = (profile.ultraStocks && profile.ultraStocks[sk.id]) || 0;
          const isEq = profile.equippedUltra === sk.id;
          const item = document.createElement('div');
          item.className = 'ultra-item' + (isEq ? ' equipped' : '');
          item.innerHTML = `<span>${sk.icon} ${sk.name}</span><strong>x${stock}</strong>`;
          item.title = sk.description;
          item.addEventListener('click', () => {
            if (stock <= 0) return;
            socket.emit('equipUltraSkill', { clientKey, skillId: sk.id });
          });
          ultraStockList.appendChild(item);
        }
        const eqDef = profile.equippedUltra ? getUltraSkillDef(profile.equippedUltra) : null;
        ultraEquipDisp.textContent = eqDef
          ? `装備必殺技: ${eqDef.icon} ${eqDef.name} (Space)`
          : '装備必殺技: なし (Space)';
      }

      function updateElementDisplay() {
        const elId = determineElementFromPixels(pixels);
        const info = getElementInfo(elId);
        elementDisp.textContent = `属性: ${info.name} (${info.icon})`;
        elementDisp.style.borderColor = info.color;
      }

      function drawEditorCanvas() {
        const now = performance.now();
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            const val = pixels[y][x];
            let fill = val;
            if (val === 'SPECIAL_GOLD') {
              fill = Math.sin(now / 140 + x + y) > 0 ? '#ffd700' : '#fff3b0';
            } else if (val === 'SPECIAL_RAINBOW') {
              const hue = (now / 6 + x * 10 + y * 10) % 360;
              fill = `hsl(${hue}, 95%, 60%)`;
            } else if (val === 'SPECIAL_VENOM') {
              fill = Math.cos(now / 160 + x - y) > 0 ? '#9333ea' : '#2e1065';
            }
            editorCtx.fillStyle = fill;
            editorCtx.fillRect(x * PIXEL_PX, y * PIXEL_PX, PIXEL_PX, PIXEL_PX);
          }
        }
        updateElementDisplay();
      }

      function paintAtClientPos(clientX, clientY) {
        const rect = editorCanvas.getBoundingClientRect();
        const gx = Math.floor(((clientX - rect.left) / rect.width) * GRID_SIZE);
        const gy = Math.floor(((clientY - rect.top) / rect.height) * GRID_SIZE);
        if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return;
        pixels[gy][gx] = selectedBrush;
        drawEditorCanvas();
      }

      editorCanvas.addEventListener('mousedown', (e) => {
        isDrawingPixel = true;
        paintAtClientPos(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDrawingPixel) return;
        paintAtClientPos(e.clientX, e.clientY);
      });
      window.addEventListener('mouseup', () => {
        isDrawingPixel = false;
      });

      document.getElementById('clearCanvasBtn').addEventListener('click', () => {
        pixels = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill('#ffffff'));
        drawEditorCanvas();
      });

      function pushCharacterSync() {
        const name = (nameInput.value || 'プレイヤー').trim() || 'プレイヤー';
        socket.emit('syncProfile', {
          clientKey,
          name,
          pixels,
          element: determineElementFromPixels(pixels),
          equippedUltra: profile.equippedUltra
        });
        setLog('ドット絵・属性・プロフィールを同期しました');
      }

      document.getElementById('syncCharBtn').addEventListener('click', pushCharacterSync);

      modeSelect.addEventListener('change', () => {
        stageLabel.style.display = modeSelect.value === 'boss' ? '' : 'none';
      });

      function applyServerProfile(prof) {
        if (!prof) return;
        profile = {
          points: typeof prof.points === 'number' ? prof.points : profile.points,
          unlockedStage: typeof prof.unlockedStage === 'number' ? prof.unlockedStage : profile.unlockedStage,
          ownedInks: Array.isArray(prof.ownedInks) ? prof.ownedInks : profile.ownedInks,
          equippedInk: prof.equippedInk || '',
          ultraStocks: prof.ultraStocks || {},
          equippedUltra: sanitizeUltraSkillId(prof.equippedUltra) || null
        };
        pointsDisp.textContent = `Pt: ${profile.points}`;
        renderSpecialInks();
        renderStageOptions();
        renderUltraStocks();
      }

      // Buttons
      joinBtn.addEventListener('click', () => {
        if (!socket.connected) return;
        const roomId = (roomInput.value || 'room_1').trim() || 'room_1';
        const mode = modeSelect.value === 'pvp' ? 'pvp' : 'boss';
        const stageNumber = Number(stageSelect.value) || 1;
        const stageDef = getStageByNumber(stageNumber);
        socket.emit('joinRoom', {
          clientKey,
          name: (nameInput.value || 'プレイヤー').trim() || 'プレイヤー',
          roomId,
          mode,
          stageNumber,
          bossId: stageDef.bossId,
          pixels,
          element: determineElementFromPixels(pixels)
        });
      });

      startBtn.addEventListener('click', () => {
        if (!socket.connected) return;
        const mode = modeSelect.value === 'pvp' ? 'pvp' : 'boss';
        const stageNumber = Number(stageSelect.value) || 1;
        const stageDef = getStageByNumber(stageNumber);
        socket.emit('startMatch', {
          roomId: (roomInput.value || 'room_1').trim() || 'room_1',
          mode,
          stageNumber,
          bossId: stageDef.bossId
        });
      });

      lobbyBtn.addEventListener('click', () => {
        if (!socket.connected) return;
        socket.emit('returnToLobby', {
          roomId: (roomInput.value || 'room_1').trim() || 'room_1'
        });
      });

      inkGachaBtn.addEventListener('click', () => {
        if (!socket.connected || isPullingGacha) return;
        isPullingGacha = true;
        inkGachaBtn.disabled = true;
        socket.emit('pullInkGacha', { clientKey });
      });

      ultraGachaBtn.addEventListener('click', () => {
        if (!socket.connected || isPullingGacha) return;
        isPullingGacha = true;
        ultraGachaBtn.disabled = true;
        socket.emit('pullUltraGacha', { clientKey });
      });

      // Input handling
      function sendMoveInput() {
        if (!socket.connected) return;
        socket.emit('playerInput', { ...keysDown });
      }

      function triggerAction(actionKey) {
        if (!socket.connected || roomState !== 'playing') return;
        const me = myPlayerId ? playersMap[myPlayerId] : null;
        if (!me || me.isDead || me.isEliminated) return;
        const now = Date.now();

        if (actionKey === 'shield') {
          const cd = GAME_RULES.ACTIONS.shield.cooldownMs;
          if (now < localLastActionAt.shield + cd) return;
          localLastActionAt.shield = now;
          socket.emit('playerAttack', { kind: 'shield' });
        } else if (actionKey === 'slash') {
          const cd = GAME_RULES.ACTIONS.slash.cooldownMs;
          if (now < localLastActionAt.slash + cd) return;
          localLastActionAt.slash = now;
          socket.emit('playerAttack', { kind: 'slash' });

          const reachMult = (me.ultraDemonBladeUntil && now < me.ultraDemonBladeUntil) ? 1.5 : 1.0;
          const reach = GAME_RULES.ACTIONS.slash.range * reachMult;
          const pcx = me.x + 24;
          const pcy = me.y + 24;
          playerSlashes.push({
            x: pcx,
            y: pcy,
            facing: me.facing || 'down',
            reach,
            life: 10,
            maxLife: 10,
            demonBlade: reachMult > 1.0
          });

          if (roomMode === 'boss' && bossState && bossState.hp > 0) {
            if (Math.hypot(bossState.x - pcx, bossState.y - pcy) <= reach + bossState.radius) {
              socket.emit('damageBoss', { matchId: currentMatchId, kind: 'slash' });
            }
          }
        } else if (actionKey === 'shot') {
          const cd = GAME_RULES.ACTIONS.shot.cooldownMs;
          if (now < localLastActionAt.shot + cd) return;
          localLastActionAt.shot = now;
          const spd = GAME_RULES.ACTIONS.shot.speed || 9.5;
          let vx = 0;
          let vy = spd;
          switch (me.facing) {
            case 'up': vx = 0; vy = -spd; break;
            case 'down': vx = 0; vy = spd; break;
            case 'left': vx = -spd; vy = 0; break;
            case 'right': vx = spd; vy = 0; break;
            default: vx = 0; vy = spd; break;
          }
          socket.emit('playerAttack', { kind: 'shot', vx, vy, facing: me.facing });
          playerShots.push({
            ownerId: me.id,
            x: me.x + 24,
            y: me.y + 24,
            vx,
            vy,
            element: me.element || 'neutral',
            life: 75
          });
        } else if (actionKey === 'ultra') {
          const cd = GAME_RULES.ACTIONS.ultra.cooldownMs;
          if (now < ultraCooldownUntilLocal || now < localLastActionAt.ultra + cd) return;
          const eqId = sanitizeUltraSkillId(profile.equippedUltra);
          if (!eqId || ((profile.ultraStocks && profile.ultraStocks[eqId]) || 0) <= 0) {
            setLog('装備中の必殺技ストックがありません');
            return;
          }
          localLastActionAt.ultra = now;
          ultraCooldownUntilLocal = now + cd;
          let dirX = 0;
          let dirY = 1;
          switch (me.facing) {
            case 'up': dirX = 0; dirY = -1; break;
            case 'down': dirX = 0; dirY = 1; break;
            case 'left': dirX = -1; dirY = 0; break;
            case 'right': dirX = 1; dirY = 0; break;
            default: dirX = 0; dirY = 1; break;
          }
          socket.emit('useUltraSkill', { matchId: currentMatchId, skillId: eqId, dirX, dirY });
        }
      }

      window.addEventListener('keydown', (e) => {
        if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          return;
        }
        let moved = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { keysDown.up = true; moved = true; }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { keysDown.down = true; moved = true; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keysDown.left = true; moved = true; }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keysDown.right = true; moved = true; }
        if (moved) {
          e.preventDefault();
          sendMoveInput();
          return;
        }
        if (e.code === GAME_RULES.ACTIONS.shield.key) { e.preventDefault(); triggerAction('shield'); }
        else if (e.code === GAME_RULES.ACTIONS.slash.key) { e.preventDefault(); triggerAction('slash'); }
        else if (e.code === GAME_RULES.ACTIONS.shot.key) { e.preventDefault(); triggerAction('shot'); }
        else if (e.code === GAME_RULES.ACTIONS.ultra.key) { e.preventDefault(); triggerAction('ultra'); }
      });

      window.addEventListener('keyup', (e) => {
        let moved = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { keysDown.up = false; moved = true; }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { keysDown.down = false; moved = true; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keysDown.left = false; moved = true; }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keysDown.right = false; moved = true; }
        if (moved) sendMoveInput();
      });

      // Socket events
      socket.on('connect', () => {
        connStatus.textContent = '接続中';
        connStatus.style.color = '#4ade80';
        unlockActionLocks();
        socket.emit('syncProfile', {
          clientKey,
          name: (nameInput.value || 'プレイヤー').trim() || 'プレイヤー',
          pixels,
          element: determineElementFromPixels(pixels)
        });
      });

      socket.on('disconnect', () => {
        connStatus.textContent = '切断';
        connStatus.style.color = '#f87171';
        keysDown.up = keysDown.down = keysDown.left = keysDown.right = false;
        unlockActionLocks();
        startBtn.disabled = true;
        lobbyBtn.disabled = true;
        setLog('サーバーから切断されました');
      });

      socket.on('profileUpdated', (prof) => {
        applyServerProfile(prof);
      });

      socket.on('joinedRoom', (payload) => {
        myPlayerId = payload.playerId;
        roomMode = payload.mode || 'boss';
        roomState = payload.state || 'lobby';
        playersMap = payload.players || Object.create(null);
        if (payload.profile) applyServerProfile(payload.profile);
        startBtn.disabled = false;
        lobbyBtn.disabled = false;
        matchStateDisp.textContent = `状態: ${roomState}`;
        setLog(`ルーム「${payload.roomId}」に入室しました`);
      });

      socket.on('roomUpdated', (payload) => {
        if (payload && payload.players) playersMap = payload.players;
      });

      socket.on('inkGachaResult', (res) => {
        unlockActionLocks();
        if (!res || !res.ok) {
          setLog('インクガチャ失敗（ポイント不足など）');
          return;
        }
        if (res.profile) applyServerProfile(res.profile);
        const inkName = (SPECIAL_INKS[res.inkId] && SPECIAL_INKS[res.inkId].name) || res.inkId;
        setLog(res.isDuplicate
          ? `特別インク「${inkName}」が重複！ ${res.refundPt}Pt 還元`
          : `特別インク「${inkName}」を獲得！`);
      });

      socket.on('ultraGachaResult', (res) => {
        unlockActionLocks();
        if (!res || !res.ok) {
          setLog('必殺技ガチャ失敗（ポイント不足など）');
          return;
        }
        if (res.profile) applyServerProfile(res.profile);
        const sk = getUltraSkillDef(res.skillId);
        const skName = sk ? `${sk.icon} ${sk.name} [${sk.rarity}]` : res.skillId;
        setLog(res.isDuplicate
          ? `${skName} がストック上限(3)のため ${res.refundPt}Pt 還元`
          : `${skName} を獲得しました！`);
      });

      socket.on('matchCountdown', (payload) => {
        if (payload.matchId) currentMatchId = payload.matchId;
        roomState = 'countdown';
        clearRoundTransientState();
        if (payload.mode) roomMode = payload.mode;
        if (payload.boss !== undefined) bossState = payload.boss;
        if (payload.players) playersMap = payload.players;
        if (payload.breakableWalls) breakableWalls = payload.breakableWalls;
        if (payload.items) itemsList = payload.items;
        matchStateDisp.textContent = `状態: カウントダウン (${payload.seconds})`;
        setLog(`試合開始まで ${payload.seconds} 秒...`);
      });

      socket.on('matchStart', (payload) => {
        if (payload.matchId) currentMatchId = payload.matchId;
        roomState = 'playing';
        roomMode = payload.mode || roomMode;
        timeLeftSec = payload.timeLeftSec || 0;
        if (payload.boss !== undefined) bossState = payload.boss;
        if (payload.players) playersMap = payload.players;
        matchStateDisp.textContent = '状態: 戦闘中';
        setLog('バトル開始！');
      });

      socket.on('timerSync', (payload) => {
        if (payload && typeof payload.timeLeftSec === 'number') {
          timeLeftSec = payload.timeLeftSec;
        }
      });

      socket.on('gameState', (payload) => {
        if (payload.matchId && currentMatchId && payload.matchId !== currentMatchId) return;
        if (payload.matchId) currentMatchId = payload.matchId;
        if (payload.state) roomState = payload.state;
        if (typeof payload.timeLeftSec === 'number') timeLeftSec = payload.timeLeftSec;
        if (payload.players) playersMap = payload.players;
        if (payload.boss !== undefined) bossState = payload.boss;
        if (payload.breakableWalls) breakableWalls = payload.breakableWalls;
        if (payload.items) itemsList = payload.items;

        const me = myPlayerId ? playersMap[myPlayerId] : null;
        if (me) {
          hpDisp.textContent = `HP: ${me.hp}/${me.maxHp}${me.isDead || me.isEliminated ? ' (戦闘不能)' : ''}`;
        }
      });

      socket.on('playerShot', (ev) => {
        if (!ev || ev.playerId === myPlayerId) return;
        playerShots.push({
          ownerId: ev.playerId,
          x: ev.x,
          y: ev.y,
          vx: ev.vx,
          vy: ev.vy,
          element: ev.element || 'neutral',
          life: 75
        });
      });

      socket.on('playerSlash', (ev) => {
        if (!ev || ev.playerId === myPlayerId) return;
        playerSlashes.push({
          x: ev.x + 24,
          y: ev.y + 24,
          facing: ev.facing || 'down',
          reach: ev.demonBladeActive ? GAME_RULES.ACTIONS.slash.range * 1.5 : GAME_RULES.ACTIONS.slash.range,
          life: 10,
          maxLife: 10,
          demonBlade: Boolean(ev.demonBladeActive)
        });
      });

      socket.on('playerDamaged', (ev) => {
        const pl = playersMap[ev.playerId];
        if (pl) {
          pl.hp = ev.hp;
          pl.maxHp = ev.maxHp;
          addFloatingText(pl.x + 24, pl.y - 6, `-${ev.damage}`, '#ff6b6b');
        }
        if (ev.playerId === myPlayerId) {
          shakeFrames = 6;
          shakeIntensity = 6;
          hpDisp.textContent = `HP: ${ev.hp}/${ev.maxHp}`;
        }
      });

      socket.on('playerBlocked', (ev) => {
        const pl = playersMap[ev.playerId];
        if (pl) addFloatingText(pl.x + 24, pl.y - 10, 'BLOCK!', '#38bdf8');
      });

      socket.on('playerKO', (ev) => {
        const pl = playersMap[ev.playerId];
        if (pl) pl.isDead = true;
        if (ev.playerId === myPlayerId) setLog('KOされました！3秒後にリスポーンします...');
      });

      socket.on('playerEliminated', (ev) => {
        const pl = playersMap[ev.playerId];
        if (pl) { pl.isDead = true; pl.isEliminated = true; }
        if (ev.playerId === myPlayerId) setLog('戦闘不能になりました（観戦中）');
      });

      socket.on('playerRespawn', (ev) => {
        const pl = playersMap[ev.playerId];
        if (pl) {
          pl.x = ev.x;
          pl.y = ev.y;
          pl.hp = ev.hp;
          pl.maxHp = ev.maxHp;
          pl.isDead = false;
          pl.isEliminated = false;
        }
        if (ev.playerId === myPlayerId) {
          hpDisp.textContent = `HP: ${ev.hp}/${ev.maxHp}`;
          setLog('リスポーンしました！');
        }
      });

      socket.on('bossDamaged', (ev) => {
        if (bossState) {
          bossState.hp = ev.hp;
          bossState.maxHp = ev.maxHp;
          addFloatingText(bossState.x + (Math.random() - 0.5) * 30, bossState.y - 36, `-${ev.damage}`, '#ffd166');
        }
      });

      socket.on('bossStateUpdated', (b) => {
        if (b) bossState = Object.assign({}, bossState, b);
      });

      socket.on('bossAttackEvent', (ev) => {
        handleClientBossAttack(ev, {
          bossState,
          bossProjectiles,
          bossEffects,
          addFloatingText,
          setVortex: (untilMs, pullStr) => {
            vortexUntil = untilMs;
            vortexPullStrength = pullStr;
          },
          onShake: (frames, intensity) => {
            shakeFrames = Math.max(shakeFrames, frames);
            shakeIntensity = Math.max(shakeIntensity, intensity);
          }
        });
      });

      socket.on('ultraSkillEvent', (ev) => {
        if (!ev) return;
        const sk = getUltraSkillDef(ev.skillId);
        const owner = playersMap[ev.ownerId];
        const ox = owner ? owner.x + 24 : GAME_RULES.ARENA.CENTER_X;
        const oy = owner ? owner.y + 24 : GAME_RULES.ARENA.PLAY_CENTER_Y;

        if (ev.phase === 'activate' && sk) {
          addFloatingText(ox, oy - 36, `${sk.icon} ${sk.name}!!`, sk.color);
          if (ev.ownerId === myPlayerId && typeof ev.cooldownUntil === 'number') {
            ultraCooldownUntilLocal = ev.cooldownUntil;
          }
        } else if (ev.phase === 'charge') {
          ultraEffects.push({
            type: 'eod_charge',
            x: ev.x, y: ev.y, dirX: ev.dirX, dirY: ev.dirY,
            range: ev.range || 620, halfWidth: ev.halfWidth || 56,
            timer: Math.max(12, Math.round((ev.chargeMs || 350) / 16))
          });
        } else if (ev.phase === 'fire' && ev.skillId === 'end_of_days') {
          shakeFrames = 14;
          shakeIntensity = 10;
          ultraEffects.push({
            type: 'eod_beam',
            x1: ev.x1, y1: ev.y1, x2: ev.x2, y2: ev.y2,
            halfWidth: ev.halfWidth || 56,
            timer: Math.max(10, Math.round((ev.durationMs || 260) / 16))
          });
        } else if (ev.phase === 'warn' && ev.skillId === 'sky_meteor') {
          ultraEffects.push({
            type: 'meteor_skill_warn',
            zones: ev.zones || [],
            timer: Math.max(18, Math.round((ev.warnMs || 650) / 16))
          });
        } else if (ev.phase === 'fire' && ev.skillId === 'sky_meteor') {
          shakeFrames = 12;
          shakeIntensity = 8;
          ultraEffects.push({
            type: 'meteor_skill_fire',
            zones: ev.zones || [],
            timer: 20
          });
        } else if (ev.phase === 'counter_burst') {
          shakeFrames = 10;
          shakeIntensity = 7;
          ultraEffects.push({
            type: 'counter_ring',
            x: ev.x, y: ev.y, radius: ev.radius || 210,
            timer: 18, maxTimer: 18
          });
        } else if (ev.phase === 'pierce_absolute_wall' || ev.phase === 'blocked') {
          const target = playersMap[ev.targetId];
          if (target) {
            addFloatingText(target.x + 24, target.y - 28, ev.label || 'ABSOLUTE!', '#00e5ff');
          }
        } else if (ev.phase === 'time_stop_active') {
          ultraEffects.push({
            type: 'time_stop_overlay',
            untilMs: ev.timeStopUntil || (performance.now() + 2500)
          });
          setLog('⏳ 刻の静止が発動！');
        } else if (ev.phase === 'end' && ev.skillId === 'time_stop') {
          ultraEffects = ultraEffects.filter((u) => u.type !== 'time_stop_overlay');
        }
      });

      socket.on('matchResult', (ev) => {
        roomState = 'ended';
        clearRoundTransientState();
        matchStateDisp.textContent = '状態: 終了';
        const myReward = ev.rewards && myPlayerId ? ev.rewards[myPlayerId] : null;
        const ptMsg = myReward ? ` (+${myReward.earnedPt}Pt)` : '';
        setLog(`${ev.summaryText || '試合終了'}${ptMsg}`);
      });

      socket.on('returnedToLobby', (ev) => {
        roomState = 'lobby';
        bossState = null;
        clearRoundTransientState();
        if (ev && ev.players) playersMap = ev.players;
        matchStateDisp.textContent = '状態: ロビー';
        setLog('ロビーに戻りました');
      });

      // Simulation & Render loop
      function updateClientSim() {
        const nowPerf = performance.now();
        const nowEpoch = Date.now();

        if (vortexUntil > 0 && nowPerf < vortexUntil && bossState && roomState === 'playing') {
          const me = myPlayerId ? playersMap[myPlayerId] : null;
          if (me && !me.isDead && !me.isEliminated) {
            const pcx = me.x + 24;
            const pcy = me.y + 24;
            const ang = Math.atan2(bossState.y - pcy, bossState.x - pcx);
            me.x = Math.max(0, Math.min(GAME_RULES.ARENA.WIDTH - 48, me.x + Math.cos(ang) * vortexPullStrength));
            me.y = Math.max(GAME_RULES.ARENA.TOP, Math.min(GAME_RULES.ARENA.HEIGHT - 48, me.y + Math.sin(ang) * vortexPullStrength));
          }
        }

        // Player shots
        for (let i = playerShots.length - 1; i >= 0; i--) {
          const s = playerShots[i];
          s.x += s.vx;
          s.y += s.vy;
          s.life -= 1;

          let hit = false;
          if (s.ownerId === myPlayerId && roomMode === 'boss' && bossState && bossState.hp > 0 && roomState === 'playing') {
            if (Math.hypot(s.x - bossState.x, s.y - bossState.y) <= bossState.radius + 8) {
              socket.emit('damageBoss', { matchId: currentMatchId, kind: 'shot' });
              hit = true;
            }
          }

          if (!hit) {
            for (const obs of STATIC_OBSTACLES) {
              if (s.x >= obs.x && s.x <= obs.x + obs.w && s.y >= obs.y && s.y <= obs.y + obs.h) {
                hit = true;
                break;
              }
            }
          }

          if (hit || s.life <= 0 || s.x < 0 || s.x > GAME_RULES.ARENA.WIDTH || s.y < GAME_RULES.ARENA.TOP || s.y > GAME_RULES.ARENA.HEIGHT) {
            playerShots.splice(i, 1);
          }
        }

        for (let i = playerSlashes.length - 1; i >= 0; i--) {
          playerSlashes[i].life -= 1;
          if (playerSlashes[i].life <= 0) playerSlashes.splice(i, 1);
        }

        // Boss projectiles (client-side hit report for non-server-authoritative kinds)
        const me = myPlayerId ? playersMap[myPlayerId] : null;
        if (me && roomState === 'playing') {
          const localMe = {
            x: me.x,
            y: me.y,
            isDead: Boolean(me.isDead),
            isEliminated: Boolean(me.isEliminated),
            invincibleUntil: me.invincibleUntil || 0
          };
          updateBossProjectilesClient(bossProjectiles, {
            now: nowEpoch,
            player: localMe,
            staticObstacles: STATIC_OBSTACLES,
            arenaWidth: GAME_RULES.ARENA.WIDTH,
            arenaTop: GAME_RULES.ARENA.TOP,
            arenaHeight: GAME_RULES.ARENA.HEIGHT,
            onHitPlayer: (bp) => {
              if (!bp || SERVER_AUTHORITATIVE_PROJECTILES.has(bp.kind)) return;
              socket.emit('bossProjectileHit', {
                matchId: currentMatchId,
                targetPlayerId: myPlayerId,
                kind: bp.kind || 'spiral',
                damage: bp.damage || 12
              });
            }
          });
        } else {
          for (let i = bossProjectiles.length - 1; i >= 0; i--) {
            const bp = bossProjectiles[i];
            bp.x += bp.vx || 0;
            bp.y += bp.vy || 0;
            bp.life -= 1;
            if (bp.life <= 0) bossProjectiles.splice(i, 1);
          }
        }

        for (let i = bossEffects.length - 1; i >= 0; i--) {
          bossEffects[i].timer -= 1;
          if (bossEffects[i].timer <= 0) bossEffects.splice(i, 1);
        }

        for (let i = ultraEffects.length - 1; i >= 0; i--) {
          const u = ultraEffects[i];
          if (u.type === 'time_stop_overlay') {
            if (nowPerf >= u.untilMs) ultraEffects.splice(i, 1);
          } else {
            u.timer -= 1;
            if (u.timer <= 0) ultraEffects.splice(i, 1);
          }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y -= 0.8;
          ft.life -= 1;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        const mins = Math.floor(Math.max(0, timeLeftSec) / 60);
        const secs = Math.max(0, timeLeftSec) % 60;
        timerDisp.textContent = `残り: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function drawArena() {
        const nowPerf = performance.now();
        gameCtx.save();
        gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

        if (shakeFrames > 0) {
          shakeFrames -= 1;
          const sx = (Math.random() - 0.5) * shakeIntensity * 2;
          const sy = (Math.random() - 0.5) * shakeIntensity * 2;
          gameCtx.translate(sx, sy);
        }

        // Top HUD bar inside canvas
        gameCtx.fillStyle = '#0b1324';
        gameCtx.fillRect(0, 0, GAME_RULES.ARENA.WIDTH, GAME_RULES.ARENA.TOP);
        gameCtx.strokeStyle = '#1e293b';
        gameCtx.strokeRect(0, GAME_RULES.ARENA.TOP, GAME_RULES.ARENA.WIDTH, GAME_RULES.ARENA.HEIGHT - GAME_RULES.ARENA.TOP);

        // Static obstacles
        for (const obs of STATIC_OBSTACLES) {
          gameCtx.fillStyle = '#334155';
          gameCtx.fillRect(obs.x, obs.y, obs.w, obs.h);
          gameCtx.strokeStyle = '#64748b';
          gameCtx.lineWidth = 2;
          gameCtx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        }

        // Breakable walls
        for (const w of breakableWalls) {
          if (w.hp <= 0) continue;
          gameCtx.fillStyle = '#78350f';
          gameCtx.fillRect(w.x, w.y, w.w, w.h);
          gameCtx.strokeStyle = '#f59e0b';
          gameCtx.lineWidth = 2;
          gameCtx.strokeRect(w.x, w.y, w.w, w.h);
        }

        // Items
        for (const it of itemsList) {
          const itDef = GAME_RULES.ITEMS[it.kind];
          gameCtx.beginPath();
          gameCtx.arc(it.x, it.y, it.radius || 16, 0, Math.PI * 2);
          gameCtx.fillStyle = (itDef && itDef.color) || '#38bdf8';
          gameCtx.fill();
          gameCtx.strokeStyle = '#ffffff';
          gameCtx.lineWidth = 2;
          gameCtx.stroke();
        }

        // Boss effects & projectiles
        drawBossEffectsAndProjectiles(gameCtx, bossEffects, bossProjectiles);

        // Boss entity + HP bar
        if (bossState && bossState.hp > 0) {
          drawBossEntity(gameCtx, bossState, nowPerf, { vortexUntil });

          const barW = 420;
          const barX = (GAME_RULES.ARENA.WIDTH - barW) / 2;
          const barY = GAME_RULES.ARENA.TOP + 10;
          gameCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          gameCtx.fillRect(barX, barY, barW, 14);
          const ratio = Math.max(0, Math.min(1, bossState.hp / bossState.maxHp));
          gameCtx.fillStyle = bossState.phase === 2 ? '#ef4444' : '#f59e0b';
          gameCtx.fillRect(barX, barY, barW * ratio, 14);
          gameCtx.strokeStyle = '#f8fafc';
          gameCtx.lineWidth = 1.5;
          gameCtx.strokeRect(barX, barY, barW, 14);
          gameCtx.fillStyle = '#ffffff';
          gameCtx.font = 'bold 11px sans-serif';
          gameCtx.textAlign = 'center';
          gameCtx.fillText(`${bossState.name}  HP ${bossState.hp}/${bossState.maxHp} (P${bossState.phase})`, barX + barW / 2, barY + 11);
        }

        // Players
        for (const id in playersMap) {
          const p = playersMap[id];
          if (!p || p.isEliminated) continue;
          gameCtx.save();
          if (p.isDead) gameCtx.globalAlpha = 0.35;

          const elInfo = getElementInfo(p.element);
          gameCtx.fillStyle = elInfo.color;
          gameCtx.fillRect(p.x, p.y, 48, 48);
          gameCtx.strokeStyle = id === myPlayerId ? '#ffffff' : '#94a3b8';
          gameCtx.lineWidth = id === myPlayerId ? 3 : 1.5;
          gameCtx.strokeRect(p.x, p.y, 48, 48);

          if (p.shieldUntil && Date.now() < p.shieldUntil) {
            gameCtx.beginPath();
            gameCtx.arc(p.x + 24, p.y + 24, 34, 0, Math.PI * 2);
            gameCtx.strokeStyle = '#38bdf8';
            gameCtx.lineWidth = 3;
            gameCtx.stroke();
          }

          if (p.ultraAbsoluteWallUntil && Date.now() < p.ultraAbsoluteWallUntil) {
            gameCtx.beginPath();
            gameCtx.arc(p.x + 24, p.y + 24, 38, 0, Math.PI * 2);
            gameCtx.strokeStyle = '#00e5ff';
            gameCtx.lineWidth = 4;
            gameCtx.stroke();
          }

          gameCtx.fillStyle = '#f8fafc';
          gameCtx.font = 'bold 11px sans-serif';
          gameCtx.textAlign = 'center';
          gameCtx.fillText(`${p.name || 'P'} (${p.hp})`, p.x + 24, p.y - 6);
          gameCtx.restore();
        }

        // Player shots & slashes
        for (const s of playerShots) {
          gameCtx.beginPath();
          gameCtx.arc(s.x, s.y, 6, 0, Math.PI * 2);
          gameCtx.fillStyle = '#60a5fa';
          gameCtx.fill();
          gameCtx.strokeStyle = '#ffffff';
          gameCtx.lineWidth = 1.5;
          gameCtx.stroke();
        }

        for (const sl of playerSlashes) {
          gameCtx.save();
          gameCtx.globalAlpha = Math.max(0.2, sl.life / sl.maxLife);
          gameCtx.beginPath();
          gameCtx.arc(sl.x, sl.y, sl.reach, -0.8, 0.8);
          gameCtx.strokeStyle = sl.demonBlade ? '#e879f9' : '#f8fafc';
          gameCtx.lineWidth = sl.demonBlade ? 8 : 5;
          gameCtx.stroke();
          gameCtx.restore();
        }

        // Ultra skill effects
        for (const u of ultraEffects) {
          gameCtx.save();
          if (u.type === 'eod_charge') {
            const ex = u.x + u.dirX * u.range;
            const ey = u.y + u.dirY * u.range;
            gameCtx.beginPath();
            gameCtx.moveTo(u.x, u.y);
            gameCtx.lineTo(ex, ey);
            gameCtx.strokeStyle = 'rgba(255, 77, 109, 0.55)';
            gameCtx.lineWidth = u.halfWidth * 1.4;
            gameCtx.stroke();
          } else if (u.type === 'eod_beam') {
            gameCtx.beginPath();
            gameCtx.moveTo(u.x1, u.y1);
            gameCtx.lineTo(u.x2, u.y2);
            gameCtx.strokeStyle = '#ff4d6d';
            gameCtx.lineWidth = u.halfWidth * 1.8;
            gameCtx.stroke();
            gameCtx.beginPath();
            gameCtx.moveTo(u.x1, u.y1);
            gameCtx.lineTo(u.x2, u.y2);
            gameCtx.strokeStyle = '#ffffff';
            gameCtx.lineWidth = u.halfWidth * 0.6;
            gameCtx.stroke();
          } else if (u.type === 'meteor_skill_warn') {
            for (const z of (u.zones || [])) {
              gameCtx.beginPath();
              gameCtx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
              gameCtx.fillStyle = 'rgba(255, 159, 67, 0.2)';
              gameCtx.fill();
              gameCtx.strokeStyle = '#ff9f43';
              gameCtx.lineWidth = 2.5;
              gameCtx.setLineDash([6, 4]);
              gameCtx.stroke();
            }
          } else if (u.type === 'meteor_skill_fire') {
            for (const z of (u.zones || [])) {
              gameCtx.beginPath();
              gameCtx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
              gameCtx.fillStyle = 'rgba(255, 120, 40, 0.55)';
              gameCtx.fill();
              gameCtx.strokeStyle = '#fff3b0';
              gameCtx.lineWidth = 5;
              gameCtx.stroke();
            }
          } else if (u.type === 'counter_ring') {
            gameCtx.beginPath();
            gameCtx.arc(u.x, u.y, u.radius, 0, Math.PI * 2);
            gameCtx.strokeStyle = '#ffd60a';
            gameCtx.lineWidth = 6;
            gameCtx.stroke();
          } else if (u.type === 'time_stop_overlay') {
            gameCtx.fillStyle = 'rgba(139, 92, 246, 0.16)';
            gameCtx.fillRect(0, GAME_RULES.ARENA.TOP, GAME_RULES.ARENA.WIDTH, GAME_RULES.ARENA.HEIGHT - GAME_RULES.ARENA.TOP);
          }
          gameCtx.restore();
        }

        // Floating damage / status texts
        for (const ft of floatingTexts) {
          gameCtx.save();
          gameCtx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          gameCtx.font = 'bold 14px sans-serif';
          gameCtx.textAlign = 'center';
          gameCtx.fillStyle = ft.color;
          gameCtx.fillText(ft.text, ft.x, ft.y);
          gameCtx.restore();
        }

        gameCtx.restore();
      }

      // Initialize UI & main frame loop
      renderStageOptions();
      renderUltraStocks();
      drawEditorCanvas();

      function frameLoop() {
        updateClientSim();
        drawArena();
        requestAnimationFrame(frameLoop);
      }
      requestAnimationFrame(frameLoop);
    })();
  </script>
